[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg"
version = "0.1.0"
description = "ECG diagnostic classification on PTB-XL with a temporal shuffle probe"
requires-python = ">=3.9"
dependencies = ["torch>=2.3", "wfdb", "numpy", "pandas", "scikit-learn", "pyyaml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
