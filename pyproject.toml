[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg"
version = "0.1.0"
description = "ECG diagnostic classification on PTB-XL with a temporal shuffle probe"
requires-python = ">=3.9"
dependencies = ["torch>=2.3", "wfdb>=4.1", "numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end runs of the training scripts (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "E731", "E501"]  # constant default arg; short lambdas and a few long lines in scripts
