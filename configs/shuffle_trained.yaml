# Same as default.yaml, but the model is trained on ECGs shuffled into 1 s segments.
# If it matches the baseline on a class, that diagnosis does not need temporal order.
name: resnet1d_shuffle_trained

data:
  root: data/ptb-xl/1.0.3
  sampling_rate: 100
  train_folds: [1, 2, 3, 4, 5, 6, 7, 8]
  val_fold: 9
  test_fold: 10

model:
  widths: [64, 128, 256, 256]
  kernel_size: 7
  dropout: 0.3

train:
  epochs: 30
  batch_size: 128
  lr: 0.003
  weight_decay: 0.01
  num_workers: 2

augment:
  scale_min: 0.8
  scale_max: 1.2
  noise_std: 0.05
  random_shift: true
  shuffle: 10

probe:
  enabled: true
  num_segments: [2, 5, 10, 20, 50]

out_dir: runs
